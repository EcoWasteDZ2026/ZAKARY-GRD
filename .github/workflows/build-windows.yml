name: Build ZAKARY GRD for Windows
on:
  workflow_dispatch:
  push:
    paths:
      - "windows_app/**"
      - ".github/workflows/build-windows.yml"
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python source
        run: python -m py_compile windows_app/main.py
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build Windows application
        run: pyinstaller --noconfirm --clean --windowed --onefile --name "ZAKARY-GRD" windows_app/main.py
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: ZAKARY-GRD-Windows
          path: dist/ZAKARY-GRD.exe
