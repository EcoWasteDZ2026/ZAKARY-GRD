name: Build ZAKARY GRD APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          unzip -q source.zip -d unpacked
          find unpacked -name gradlew -type f
          PROJECT_DIR=$(dirname "$(find unpacked -name gradlew -type f | head -n 1)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      
        
        
          

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZAKARY-GRD-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
