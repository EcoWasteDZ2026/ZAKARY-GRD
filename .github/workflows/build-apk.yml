name: Build HENKEL ZAKARY GRD APK

on:
  workflow_dispatch:
  push:
    branches:
      - henkel-apk-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify project
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/dz/zakary/grd/MainActivity.kt
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HENKEL-ZAKARY-GRD-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
