name: Build HENKEL ZAKARY GRD APK
# Rebuild requested after JavaScript startup and offline sync syntax fix

on:
  workflow_dispatch:
  push:
    branches:
      - henkel-apk-build
      - zakary-grd-v2
    paths-ignore:
      - 'docs/download/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify project
        run: |
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/dz/zakary/grd/MainActivity.kt
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: HENKEL-ZAKARY-GRD-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish public APK download
        run: |
          mkdir -p docs/download
          cp app/build/outputs/apk/debug/app-debug.apk docs/download/ZAKARY-GRD.apk
          cat > docs/download/index.html <<'EOF'
          <!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZAKARY GRD</title><body style="font-family:Arial;text-align:center;padding:40px"><h1>ZAKARY GRD</h1><p>تحميل تطبيق إدارة وبيع النفايات الصناعية</p><a href="ZAKARY-GRD.apk" download style="display:inline-block;padding:16px 24px;background:#146c43;color:white;text-decoration:none;border-radius:10px">تحميل التطبيق APK</a><p>لأجهزة Android. لتشغيله على Windows استخدم محاكي Android.</p></body></html>
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/download/ZAKARY-GRD.apk docs/download/index.html
          git commit -m "Publish ZAKARY GRD public APK download" || exit 0
          git push
