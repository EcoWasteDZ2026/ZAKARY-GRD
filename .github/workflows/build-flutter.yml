name: Build ZAKARY GRD Cross-platform

on:
  workflow_dispatch:
  push:
    branches:
      - feature/flutter-cross-platform
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'supabase/**'
      - '.github/workflows/build-flutter.yml'
      - 'installer/**'

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android and Windows platform folders
        run: flutter create --platforms=android,windows --project-name zakary_grd .
      - name: Resolve packages
        run: flutter pub get
      - name: Build release APK
        run: >-
          flutter build apk --release
          --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: ZAKARY-GRD-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows desktop installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Windows platform folder
        run: flutter create --platforms=windows --project-name zakary_grd .
      - name: Resolve packages
        run: flutter pub get
      - name: Build Windows release
        run: >-
          flutter build windows --release
          --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Build installer EXE
        shell: pwsh
        run: |
          $iscc = Get-ChildItem 'C:\Program Files (x86)\Inno Setup' -Filter 'ISCC.exe' -Recurse | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup compiler not found' }
          & $iscc.FullName installer/zakary_grd.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: ZAKARY-GRD-Windows-Installer
          path: installer/output/ZAKARY-GRD-Setup.exe
          if-no-files-found: error
          retention-days: 30
