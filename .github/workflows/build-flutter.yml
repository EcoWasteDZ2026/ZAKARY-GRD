name: Build ZAKARY GRD Cross-platform

on:
  workflow_dispatch:
  push:
    branches:
      - feature/flutter-cross-platform
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'supabase/**'
      - '.github/workflows/build-flutter.yml'
      - 'installer/**'

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android and Windows platform folders
        run: flutter create --platforms=android,windows --project-name zakary_grd .
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test
      - name: Build release APK
        run: >-
          flutter build apk --release
          --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: ZAKARY-GRD-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows desktop installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Windows platform folder
        run: flutter create --platforms=windows --project-name zakary_grd .
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test
      - name: Build Windows release
        run: >-
          flutter build windows --release
          --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      - name: Install Inno Setup
        run: choco install innosetup -y
      - name: Locate Inno Setup compiler
        id: inno
        shell: pwsh
        run: |
          $candidates = @(
            (Get-Command ISCC.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty Source),
            "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:ProgramData\chocolatey\lib\innosetup\tools\ISCC.exe",
            "$env:ProgramData\chocolatey\bin\ISCC.exe"
          ) | Where-Object { $_ -and (Test-Path $_) }
          $iscc = $candidates | Select-Object -First 1
          if (-not $iscc) {
            $roots = @("$env:ProgramFiles(x86)", "$env:ProgramFiles", "$env:ProgramData\chocolatey\lib\innosetup")
            foreach ($root in $roots) {
              if (Test-Path $root) {
                $found = Get-ChildItem $root -Filter ISCC.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($found) { $iscc = $found.FullName; break }
              }
            }
          }
          if (-not $iscc) { throw "Inno Setup compiler ISCC.exe was not found on this runner." }
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Using Inno Setup compiler: $iscc"
      - name: Build installer EXE
        shell: pwsh
        run: |
          & "${{ steps.inno.outputs.ISCC_PATH }}" installer/zakary_grd.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "installer/output/ZAKARY-GRD-Setup.exe")) {
            throw "Installer output was not created."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ZAKARY-GRD-Windows-Installer
          path: installer/output/ZAKARY-GRD-Setup.exe
          if-no-files-found: error
          retention-days: 30
